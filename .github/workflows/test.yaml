name: Test

on: [push, pull_request]

defaults:
  run:
    shell: bash

jobs:
  fetch-testdata:
    runs-on: ubuntu-latest
    outputs:
      testdata-key: ${{ steps.hash.outputs.testdata-key }}
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v6
      with:
        python-version: "3.12"
    - name: Identify the test data packages
      id: hash
      run: echo "testdata-key=testdata-$(python tests/fetch_testdata.py --hash)" >> "$GITHUB_OUTPUT"
    - name: Restore the test data
      id: cache
      uses: actions/cache@v6
      with:
        path: tests/testdata
        key: ${{ steps.hash.outputs.testdata-key }}
        enableCrossOsArchive: true
    - name: Fetch the pynbody test data from https://pynbody.pontzen.uk
      if: steps.cache.outputs.cache-hit != 'true'
      run: python tests/fetch_testdata.py

  test:
    needs: fetch-testdata
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.14"]
        include:
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true
    - name: Install bulkread (with only numpy and h5py) and pytest
      run: |
        python -m pip install --upgrade pip
        python -m pip install . pytest
        python -m pip list
    - name: Restore the test data
      uses: actions/cache/restore@v5
      with:
        path: tests/testdata
        key: ${{ needs.fetch-testdata.outputs.testdata-key }}
        enableCrossOsArchive: true
        fail-on-cache-miss: true
    - name: Run the tests
      env:
        BULKREAD_REQUIRE_TESTDATA: "1"
      # (from outside the source tree, so that the installed package is what is tested)
      run: |
        cd tests
        python -m pytest --tb=short -ra --import-mode=importlib -p no:cacheprovider .
